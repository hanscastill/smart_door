<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDoor Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #1f2937;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
        }

        .tarjetas {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .tarjeta {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .titulo {
            color: #6b7280;
            font-size: 14px;
        }

        .valor {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }

        .normal {
            color: green;
        }

        .alerta {
            color: red;
        }

        .sin-datos {
            color: #999;
        }

        button {
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-size: 15px;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>SmartDoor - Dashboard</h1>

    <p>
        Monitoreo del estado del sensor de puerta.
    </p>

    <div class="tarjetas">

        <div class="tarjeta">
            <div class="titulo">Estado de la puerta</div>
            <div class="valor" id="door_state">
                Sin datos
            </div>
        </div>

        <div class="tarjeta">
            <div class="titulo">Tiempo abierta</div>
            <div class="valor" id="open_duration">
                0 segundos
            </div>
        </div>

        <div class="tarjeta">
            <div class="titulo">Cantidad de aperturas</div>
            <div class="valor" id="access_count">
                0
            </div>
        </div>

        <div class="tarjeta">
            <div class="titulo">Estado de alerta</div>
            <div class="valor" id="alert_status">
                Sin datos
            </div>
        </div>

    </div>

    <button onclick="actualizarDatos()">
        Actualizar datos
    </button>

<h2 style="margin-top: 35px;">Historial de lecturas</h2>

<div class="tarjeta">
    <div style="overflow-x:auto;">
        <table id="tablaHistorial" style="width:100%; border-collapse:collapse;">
            <thead>
                <tr>
                    <th style="padding:12px; border-bottom:1px solid #ddd;">Fecha/Hora</th>
                    <th style="padding:12px; border-bottom:1px solid #ddd;">Estado</th>
                    <th style="padding:12px; border-bottom:1px solid #ddd;">Tiempo abierta</th>
                    <th style="padding:12px; border-bottom:1px solid #ddd;">Aperturas</th>
                    <th style="padding:12px; border-bottom:1px solid #ddd;">Alerta</th>
                </tr>
            </thead>

            <tbody id="historialBody">
                <tr>
                    <td colspan="5" style="padding:15px; text-align:center;">
                        Sin lecturas registradas
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</div>

<script>
async function actualizarDatos() {
    try {
        // ==========================================
        // 1. OBTENER DATOS DESDE LA API
        // ==========================================
        const respuesta = await fetch("/api/lecturas");

        if (!respuesta.ok) {
            throw new Error("Error HTTP: " + respuesta.status);
        }

        const datos = await respuesta.json();

        console.log("Datos recibidos:", datos);


        // ==========================================
        // 2. OBTENER ELEMENTOS DEL DASHBOARD
        // ==========================================
        const doorState =
            document.getElementById("door_state");

        const openDuration =
            document.getElementById("open_duration");

        const accessCount =
            document.getElementById("access_count");

        const alertStatus =
            document.getElementById("alert_status");

        const historialBody =
            document.getElementById("historialBody");


        // ==========================================
        // 3. LIMPIAR HISTORIAL
        // ==========================================
        historialBody.innerHTML = "";


        // ==========================================
        // 4. COMPROBAR SI HAY DATOS
        // ==========================================
        if (!datos.lecturas || datos.lecturas.length === 0) {

            doorState.textContent = "Sin datos";
            openDuration.textContent = "0 segundos";
            accessCount.textContent = "0";
            alertStatus.textContent = "Sin datos";

            historialBody.innerHTML = `
                <tr>
                    <td colspan="5"
                        style="padding:20px;
                               text-align:center;">
                        Sin lecturas registradas
                    </td>
                </tr>
            `;

            return;
        }


        // ==========================================
        // 5. OBTENER LA ÚLTIMA LECTURA
        // ==========================================
        const ultimaLectura =
            datos.lecturas[datos.lecturas.length - 1];

        const mediciones =
            ultimaLectura.measurements;


        // ==========================================
        // 6. ACTUALIZAR TARJETAS
        // ==========================================
        doorState.textContent =
            mediciones.door_state;

        openDuration.textContent =
            mediciones.open_duration + " segundos";

        accessCount.textContent =
            mediciones.access_count;

        alertStatus.textContent =
            mediciones.alert_status;


        // ==========================================
        // 7. COLOR ESTADO PUERTA
        // ==========================================
        if (mediciones.door_state === "ABIERTA") {

            doorState.style.color = "#d97706";

        } else {

            doorState.style.color = "#111827";
        }


        // ==========================================
        // 8. COLOR DE ALERTA
        // ==========================================
        if (mediciones.alert_status === "NORMAL") {

            alertStatus.style.color = "green";

        } else {

            alertStatus.style.color = "red";
        }


        // ==========================================
        // 9. CREAR HISTORIAL
        // ==========================================
        datos.lecturas
            .slice()
            .reverse()
            .forEach(lectura => {

                const medicion =
                    lectura.measurements;

                const fecha =
                    new Date(lectura.timestamp);

                const fila =
                    document.createElement("tr");

                const esAlerta =
                    medicion.alert_status !== "NORMAL";


                fila.innerHTML = `
                    <td style="
                        padding:12px;
                        border-bottom:1px solid #ddd;
                    ">
                        ${fecha.toLocaleString()}
                    </td>

                    <td style="
                        padding:12px;
                        border-bottom:1px solid #ddd;
                        font-weight:bold;
                    ">
                        ${medicion.door_state}
                    </td>

                    <td style="
                        padding:12px;
                        border-bottom:1px solid #ddd;
                    ">
                        ${medicion.open_duration} segundos
                    </td>

                    <td style="
                        padding:12px;
                        border-bottom:1px solid #ddd;
                    ">
                        ${medicion.access_count}
                    </td>

                    <td style="
                        padding:12px;
                        border-bottom:1px solid #ddd;
                        font-weight:bold;
                        color:${esAlerta ? "red" : "green"};
                    ">
                        ${medicion.alert_status}
                    </td>
                `;

                historialBody.appendChild(fila);
            });


    } catch (error) {

        console.error(
            "Error al obtener los datos:",
            error
        );

        const historialBody =
            document.getElementById("historialBody");

        if (historialBody) {

            historialBody.innerHTML = `
                <tr>
                    <td colspan="5"
                        style="
                            padding:20px;
                            text-align:center;
                            color:red;
                        ">
                        Error al cargar los datos
                    </td>
                </tr>
            `;
        }
    }
}


// ==========================================
// CARGAR AL ABRIR EL DASHBOARD
// ==========================================
document.addEventListener(
    "DOMContentLoaded",
    actualizarDatos
);


// ==========================================
// ACTUALIZACIÓN AUTOMÁTICA CADA 5 SEGUNDOS
// ==========================================
setInterval(
    actualizarDatos,
    5000
);
</script>

</body>
</html>
